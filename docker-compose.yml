services:
  db:
    image: timescale/timescaledb:2.15.2-pg15
    container_name: solar-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-solar_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solar_dev_password}
      POSTGRES_DB: ${DB_NAME:-solar_monitor}
    ports:
      # Host-side 5433 (not 5432) since a native Postgres install commonly
      # already owns 5432 on the host; the backend container itself always
      # talks to this service as db:5432 over the internal Docker network.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-solar_admin} -d ${DB_NAME:-solar_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: solar-monitor-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-solar_admin}
      DB_PASSWORD: ${DB_PASSWORD:-solar_dev_password}
      DB_NAME: ${DB_NAME:-solar_monitor}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_KEY_ID: ${JWT_KEY_ID:-default}
      JWT_PREVIOUS_KEYS: ${JWT_PREVIOUS_KEYS:-}
      # Compose runs over plain HTTP on localhost, so a Secure cookie would
      # never be sent back and login would silently fail. Set to true (and
      # set a real JWT_SECRET) behind TLS.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      COLLECTOR_MAX_CONCURRENCY: ${COLLECTOR_MAX_CONCURRENCY:-10}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEYE_APP_ID: ${DEYE_APP_ID:-}
      DEYE_APP_SECRET: ${DEYE_APP_SECRET:-}
      DEYE_USERNAME: ${DEYE_USERNAME:-}
      DEYE_PASSWORD: ${DEYE_PASSWORD:-}
      DEYE_REGION: ${DEYE_REGION:-eu}
      INGECON_API_KEY: ${INGECON_API_KEY:-}
      INGECON_BASE_URL: ${INGECON_BASE_URL:-}
      SOSEN_USERNAME: ${SOSEN_USERNAME:-}
      SOSEN_PASSWORD: ${SOSEN_PASSWORD:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      TILES_DIR: ${TILES_DIR:-/app/tiles}
    volumes:
      # A bind mount, not a Dockerfile COPY: the .pmtiles basemap (see
      # docs/TILES.md) is tens of MB on a completely different change
      # cadence from the Go binary, and doesn't belong baked into an image
      # layer. Missing ./tiles on the host is fine — tileHandler degrades to
      # a 404-per-request rather than failing the mount.
      - ./tiles:/app/tiles:ro

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so
        # it has to reach the image here — the `environment:` block below
        # only affects the running container, which Next.js never reads
        # NEXT_PUBLIC_* from. Changing this value requires a rebuild
        # (`docker compose up --build frontend`), not just a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: solar-monitor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

volumes:
  db_data:
